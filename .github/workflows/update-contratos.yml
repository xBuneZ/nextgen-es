name: Actualizar contratos temas.json tipos.json cadena.json

on:
  schedule:
    - cron: "43 5 * * 1"   # lunes 05:43 UTC
  workflow_dispatch:
    inputs:
      periods:
        description: "Periodos a procesar (YYYYMM separados por espacios). Vacío = 2021..hoy"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-contratos temas.json tipos.json cadena.json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Datos publicados (rama datos)
        uses: actions/checkout@v7
        with:
          ref: datos
          path: site/data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restaurar caché de contratos temas.json tipos.json cadena.json
        uses: actions/cache@v6
        with:
          path: etl/.cache/contratos temas.json tipos.json cadena.json
          key: placsp-${{ github.run_id }}
          restore-keys: placsp-
      - name: Procesar contratos PRTR (Plataforma de Contratación y plataformas autonómicas)
        run: python3 etl/fetch_contratos.py ${{ inputs.periods && format('--periods {0}', inputs.periods) || '' }}
      - name: Temas, tipos de organización y cadena del dinero
        run: python3 etl/derivados.py
      - name: Publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: etl/publicar_datos.sh "Contratos PRTR $(date -u +%F)" contratos temas.json tipos.json cadena.json
