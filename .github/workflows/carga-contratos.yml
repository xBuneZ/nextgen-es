name: Carga histórica de contratos

# Descarga en paralelo (un trabajo por mes) el histórico de la Plataforma de
# Contratación y lo publica en la rama «datos». Se lanza a mano.
on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Primer mes (YYYYMM)"
        default: "202101"
      hasta:
        description: "Último mes (YYYYMM)"
        default: "202611"
      paralelo:
        description: "Trabajos simultáneos"
        default: "8"
      fuentes:
        description: "Conjuntos de datos: placsp (Plataforma del Estado) y/o agr (plataformas autonómicas agregadas)"
        default: "placsp agr"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.m.outputs.months }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: echo "months=$(python3 etl/fetch_contratos.py --list-months ${{ inputs.desde }} ${{ inputs.hasta }})" >> "$GITHUB_OUTPUT"

  mes:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.paralelo) }}
      matrix:
        month: ${{ fromJSON(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 etl/fetch_contratos.py --periods ${{ matrix.month }} --fuentes ${{ inputs.fuentes }} --refresh-last 1 --no-build
      - uses: actions/upload-artifact@v7
        with:
          name: contratos-${{ matrix.month }}
          path: etl/.cache/contratos/*${{ matrix.month }}.jsonl
          retention-days: 7

  unir:
    needs: mes
    if: always() && needs.mes.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Datos publicados (rama datos)
        uses: actions/checkout@v7
        with:
          ref: datos
          path: site/data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restaurar caché de contratos
        uses: actions/cache/restore@v6
        with:
          path: etl/.cache/contratos
          key: placsp-${{ github.run_id }}
          restore-keys: placsp-
      - uses: actions/download-artifact@v8
        with:
          pattern: contratos-*
          path: etl/.cache/contratos
          merge-multiple: true
      - run: ls etl/.cache/contratos | wc -l && python3 etl/fetch_contratos.py --build-only
      - name: Guardar caché de contratos
        uses: actions/cache/save@v6
        with:
          path: etl/.cache/contratos
          key: placsp-${{ github.run_id }}
      - name: Temas, tipos de organización y cadena del dinero
        run: python3 etl/derivados.py
      - name: Publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: etl/publicar_datos.sh "Contratos PRTR, carga histórica $(date -u +%F)" contratos temas.json tipos.json cadena.json
