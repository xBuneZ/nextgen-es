name: Actualizar datos

on:
  schedule:
    - cron: "17 4 * * 1"   # lunes 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restaurar caché de la BDNS
        uses: actions/cache@v4
        with:
          path: etl/.cache
          key: bdns-${{ github.run_id }}
          restore-keys: bdns-
      - name: Descargar datos de la BDNS
        run: python3 etl/fetch_bdns.py --workers 6 --refresh-days 365
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Datos: actualización BDNS $(date -u +%F)"
          git push
