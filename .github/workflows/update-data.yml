name: Actualizar datos

on:
  schedule:
    - cron: "17 4 * * 1"   # lunes 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Datos publicados (rama datos)
        uses: actions/checkout@v7
        with:
          ref: datos
          path: site/data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restaurar caché de la BDNS
        uses: actions/cache@v6
        with:
          path: etl/.cache
          key: bdns-${{ github.run_id }}
          restore-keys: bdns-
      - name: Descargar datos de la BDNS
        run: python3 etl/fetch_bdns.py --workers 6 --refresh-days 365
      - name: Publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: etl/publicar_datos.sh "Subvenciones BDNS $(date -u +%F)" resumen.json convocatorias.json convocatorias beneficiarios.json
