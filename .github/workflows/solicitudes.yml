name: Solicitudes de transparencia

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  schedule:
    - cron: "11 6 * * *"   # a diario, para marcar las que vencen el plazo
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: solicitudes
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'transparencia')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p site/data && python3 etl/solicitudes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: etl/publicar_datos.sh "Solicitudes de transparencia $(date -u +%F)" solicitudes.json
