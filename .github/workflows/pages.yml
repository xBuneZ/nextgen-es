name: Publicar web

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_run:
    workflows: ["Actualizar datos", "Actualizar contratos", "Carga histórica de contratos", "Unir carga de contratos", "Solicitudes de transparencia"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Datos (rama datos)
        uses: actions/checkout@v7
        with:
          ref: datos
          path: site/data
      - run: rm -rf site/data/.git
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
